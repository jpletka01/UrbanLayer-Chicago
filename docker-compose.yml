services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    # NO host port publishing. Qdrant ships with NO authentication, and "6333:6333"
    # binds 0.0.0.0 — which left the production vector store readable AND writable
    # from the public internet (found 2026-09-08). The backend reaches it over the
    # compose network at http://qdrant:6333, so nothing needs a host port in prod.
    # Local dev republishes it on LOOPBACK ONLY via docker-compose.override.yml.
    # Do NOT "fix" this by adding a loopback mapping to docker-compose.prod.yml:
    # Compose APPENDS list entries, so the public binding would survive alongside it.
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      # chicago.db is auto-created on first run.
      # ptaxsim.db (9.4GB, optional — enables tax estimates) must be seeded manually:
      #   docker compose cp ./backend/data/ptaxsim.db backend:/app/backend/data/
      - backend_data:/app/backend/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN}
        VITE_API_BASE: ""
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  backend_data:
