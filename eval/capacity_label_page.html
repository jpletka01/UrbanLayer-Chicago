<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capacity panel labels</title>
<style>
:root { --bg:#f7f6f3; --card:#fff; --ink:#1c1c1c; --muted:#666; --line:#ddd; --accent:#1d4ed8; --lot:#111;
        --fp:#2563eb; --lid:#9ca3af; --ok:#15803d; --warn:#b45309; --bad:#b91c1c; }
@media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1f1f1f; --ink:#eee; --muted:#aaa; --line:#333;
        --accent:#93b4ff; --lot:#f5f5f5; --fp:#60a5fa; --lid:#6b7280; } }
* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
.app { display:grid; grid-template-columns:300px 1fr; height:100vh; }
aside { border-right:1px solid var(--line); overflow:auto; background:var(--card); }
aside header { position:sticky; top:0; background:var(--card); padding:10px 12px; border-bottom:1px solid var(--line); }
aside .row { padding:7px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; gap:8px; align-items:center; }
aside .row.cur { background:color-mix(in srgb, var(--accent) 14%, transparent); }
aside .row .dot { width:9px; height:9px; border-radius:50%; border:1.5px solid var(--muted); flex:none; }
aside .row.done .dot { background:var(--ok); border-color:var(--ok); }
aside .row small { color:var(--muted); display:block; }
main { overflow:auto; padding:16px 20px 80px; }
.grid { display:grid; grid-template-columns:minmax(320px, 1fr) minmax(360px, 1fr); gap:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
h1 { font-size:20px; margin:0 0 2px; } h2 { font-size:14px; margin:0 0 8px; }
.muted { color:var(--muted); } .chip { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line); font-size:12px; margin-right:4px; }
a.btn, button { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; display:inline-block; }
a.btn.primary, button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
@media (prefers-color-scheme: dark) { a.btn.primary, button.primary { color:#111; } }
table { border-collapse:collapse; width:100%; } td, th { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
input[type=number] { width:64px; font:inherit; padding:3px 5px; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px; }
select, textarea { font:inherit; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px; }
textarea { width:100%; min-height:48px; }
svg { width:100%; height:300px; background:color-mix(in srgb, var(--bg) 60%, var(--card)); border-radius:8px; }
.big { font-size:22px; font-weight:600; }
.bin { padding:2px 8px; border-radius:6px; font-weight:600; }
.radio label { display:block; margin:3px 0; }
.legend span { margin-right:12px; font-size:12px; }
.permit { border-bottom:1px solid var(--line); padding:5px 0; } .permit:last-child { border:0; }
details summary { cursor:pointer; }
.reveal { border-left:3px solid var(--warn); padding-left:10px; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <strong>Capacity panel</strong> <span id="progress" class="muted"></span><br>
      <label class="muted"><input type="checkbox" id="onlyTodo"> Only unlabeled</label>
    </header>
    <div id="list"></div>
  </aside>
  <main id="main">Loading…</main>
</div>
<script>
let DATA, LOTS = [], EV = {}, LABELS = {}, cur = 0;
const fmt = n => n == null ? "—" : Math.round(n).toLocaleString("en-US");
const pct = x => x == null ? "—" : Math.round(x * 100) + "%";
const BINS = [[0, "Empty"], [0.25, "Under 25%"], [0.5, "25–50%"], [0.8, "50–80%"], [Infinity, "80%+"]];
function binOf(share) {
  if (share == null) return null;
  if (share === 0) return "Empty";
  if (share < 0.25) return "Under 25%";
  if (share < 0.5) return "25–50%";
  if (share < 0.8) return "50–80%";
  return "80%+";
}
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

async function load() {
  DATA = await (await fetch("/data")).json();
  for (const e of DATA.evidence) EV[e.pin] = e;
  LABELS = DATA.labels || {};
  // Newest batch first; within a batch, strata interleaved in a fixed order (by a hash of the PIN).
  LOTS = DATA.panel.lots.slice().sort((a, b) => (b.batch ?? 1) - (a.batch ?? 1) || hash(a.pin) - hash(b.pin));
  const firstTodo = LOTS.findIndex(l => !LABELS[l.pin]);
  cur = firstTodo < 0 ? 0 : firstTodo;
  renderList(); render();
}

function renderList() {
  const only = document.getElementById("onlyTodo").checked;
  const done = b => LOTS.filter(l => (l.batch ?? 1) === b && LABELS[l.pin]).length, size = b => LOTS.filter(l => (l.batch ?? 1) === b).length;
  document.getElementById("progress").textContent = [...new Set(LOTS.map(l => l.batch ?? 1))].sort().reverse()
    .map(b => `batch ${b}: ${done(b)} of ${size(b)}`).join(" · ");
  document.getElementById("list").innerHTML = LOTS.map((l, i) => (only && LABELS[l.pin] && i !== cur) ? "" :
    `<div class="row ${i === cur ? "cur" : ""} ${LABELS[l.pin] ? "done" : ""}" data-i="${i}"><span class="dot"></span>
     <div>${i + 1}. ${l.address || l.pin}<small>${l.batch ? "batch " + l.batch + " · " : ""}${l.stratum.replaceAll("_", " ")}</small></div></div>`).join("");
  for (const r of document.querySelectorAll("aside .row")) r.onclick = () => { cur = +r.dataset.i; renderList(); render(); };
}

function drawSvg(ev) {
  const rings = [...(ev.outline || [])];
  const all = rings.flat().concat((ev.lidar_2022 || []).flatMap(x => x.rings.flat()), (ev.city_footprints_2015 || []).flatMap(x => x.rings.flat()));
  if (!all.length) return "<p class='muted'>No outline.</p>";
  const k = Math.cos(41.84 * Math.PI / 180);
  const xs = all.map(p => p[0] * k), ys = all.map(p => p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
  const w = maxx - minx || 1e-5, h = maxy - miny || 1e-5, pad = Math.max(w, h) * 0.08;
  const vb = `${minx - pad} ${-(maxy + pad)} ${w + 2 * pad} ${h + 2 * pad}`;
  const sw = Math.max(w, h) / 220;
  const path = r => "M" + r.map(p => `${p[0] * k},${-p[1]}`).join("L") + "Z";
  const lid = (ev.lidar_2022 || []).map((x, i) => x.rings.map(r => `<path d="${path(r)}" fill="var(--lid)" fill-opacity=".55" stroke="var(--lid)" stroke-width="${sw}"/>`).join("") +
    (x.rings[0] ? (() => { const r = x.rings[0]; const cx = r.reduce((s, p) => s + p[0] * k, 0) / r.length, cy = r.reduce((s, p) => s - p[1], 0) / r.length;
      return `<text x="${cx}" y="${cy}" font-size="${Math.max(w, h) / 18}" text-anchor="middle" fill="var(--ink)">${String.fromCharCode(65 + i)} · ${Math.round(x.height_ft)} ft</text>`; })() : "")).join("");
  const fps = (ev.city_footprints_2015 || []).map(x => x.rings.map(r => `<path d="${path(r)}" fill="none" stroke="var(--fp)" stroke-dasharray="${sw * 4} ${sw * 3}" stroke-width="${sw * 1.4}"/>`).join("")).join("");
  const lot = rings.map(r => `<path d="${path(r)}" fill="none" stroke="var(--lot)" stroke-width="${sw * 2.2}"/>`).join("");
  return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${lid}${fps}${lot}</svg>
    <div class="legend muted"><span>━ the lot</span><span style="color:var(--fp)">┅ City footprint (2015)</span><span>▇ County LiDAR outline (2022), its highest point</span></div>`;
}

function defaults(ev) {
  return (ev.lidar_2022 || []).map(x => ({ stories: x.stories_est,
    accessory: x.height_ft < 15 && x.on_lot_sqft < 800 }));
}

function render() {
  const l = LOTS[cur], ev = EV[l.pin] || {}, saved = LABELS[l.pin];
  const rows = saved?.buildings || defaults(ev);
  const extra = saved?.extra || { sqft: 0, stories: 0 };
  const dists = ev.districts || [];
  const zone = saved?.zone ?? dists[0]?.zone ?? l.zone_class;
  const far0 = saved?.far ?? (dists[0]?.far ?? l.far);
  const lotSqft = ev.lot_sqft_outline ?? l.land_sqft;
  const sv = ev.street_view;
  document.getElementById("main").innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px">
    <div><h1>${l.address || "(no address)"}</h1>
      <div class="muted">${(l.hood || "").replaceAll("-", " ")} · PIN ${l.pin} · class ${l.class || "—"} · ${cur + 1} of ${LOTS.length}</div>
      <div style="margin-top:4px"><span class="chip">${l.stratum.replaceAll("_", " ")}</span>${l.complex_lots ? `<span class="chip">complex of ${l.complex_lots} lots</span>` : ""}${l.narrow_strip ? `<span class="chip">${l.lot_width_ft} ft wide</span>` : ""}</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
      ${sv ? `<a class="btn primary" href="${sv}" target="_blank" rel="noopener">Street View ↗</a>` : ""}
      <a class="btn" href="${ev.assessor}" target="_blank" rel="noopener">Assessor ↗</a>
      <a class="btn" href="${ev.map_link}" target="_blank" rel="noopener">Map ↗</a>
    </div>
  </div>
  <div class="grid">
    <div>
      <div class="card">${drawSvg(ev)}</div>
      <div class="card" style="margin-top:12px"><h2>Zoning by area of the lot</h2>
        ${dists.map(d => `<div>${d.zone} · ${pct(d.share)} of the lot · FAR ${d.far ?? "none"}</div>`).join("") || "<span class='muted'>No district found.</span>"}
      </div>
      <div class="card" style="margin-top:12px"><h2>Permits on this lot since 2015 (${(ev.permits || []).length})</h2>
        ${(ev.permits || []).map(p => `<div class="permit"><strong>${p.type}</strong> · ${p.date} · ${p.cost ? "$" + fmt(p.cost) : ""}<br><span class="muted">${p.address}</span><br>${p.description}</div>`).join("") || "<span class='muted'>None of the large ones (new, demolition, renovation $250k+).</span>"}
      </div>
      <div class="card" style="margin-top:12px"><h2>City footprints 2015</h2>
        ${(ev.city_footprints_2015 || []).map(f => `<div>${fmt(f.area_sqft)} sq ft · ${f.stories ?? "no"} stories</div>`).join("") || "<span class='muted'>None inside the lot.</span>"}
      </div>
    </div>
    <div>
      <div class="card"><h2>What's built (from Street View)</h2>
        <p style="margin-top:0"><strong>Measure the lot outlined in black only.</strong> A <strong>~</strong> address is approximate: the house Street View faces may be the neighbor's.</p>
        <p class="muted">Stories are pre-filled from the LiDAR height and run high on pitched roofs. Floor area counts what zoning counts: tick garages and sheds as not floor area.</p>
        <table><tr><th></th><th>On the lot</th><th>Highest point</th><th>Stories</th><th>Garage / shed</th></tr>
        ${(ev.lidar_2022 || []).map((x, i) => `<tr><td>${String.fromCharCode(65 + i)}</td><td>${fmt(x.on_lot_sqft)} sq ft</td><td>${Math.round(x.height_ft)} ft</td>
          <td><input type="number" min="0" step="1" data-b="${i}" data-k="stories" value="${rows[i]?.stories ?? x.stories_est}"></td>
          <td><input type="checkbox" data-b="${i}" data-k="accessory" ${rows[i]?.accessory ? "checked" : ""}></td></tr>`).join("")}
        <tr><td>+</td><td><input type="number" min="0" id="exSqft" value="${extra.sqft}"> sq ft</td><td class="muted">not outlined</td><td><input type="number" min="0" id="exStories" value="${extra.stories}"></td><td></td></tr>
        </table>
        <div style="display:flex;gap:16px;margin-top:10px;align-items:end;flex-wrap:wrap">
          <div>District <select id="zone">${[...new Set([zone, ...dists.map(d => d.zone)].filter(Boolean))].map(z => `<option ${z === zone ? "selected" : ""}>${z}</option>`).join("")}</select>
            FAR <input type="number" step="0.05" id="far" value="${far0 ?? ""}"></div>
          <div class="muted">Lot ${fmt(lotSqft)} sq ft</div>
        </div>
        <div style="margin-top:12px" id="calc"></div>
      </div>
      <div class="card radio" style="margin-top:12px"><h2>Your label</h2>
        ${[["estimate", "Use my estimate above"], ["empty", "Empty lot (nothing built)"], ["side_yard", "Empty, but used with the lot next door (its yard, parking or garden)"], ["not_buildable", "Not a building lot (park, strip, rail, alley, right-of-way)"], ["cant_tell", "Can't tell"]]
          .map(([v, t]) => `<label><input type="radio" name="verdict" value="${v}" ${(saved?.verdict ?? "estimate") === v ? "checked" : ""}> ${t}</label>`).join("")}
        ${l.batch ? `<h2 style="margin-top:10px">How sure are you of the floor area?</h2>
        ${[["sure", "Sure (stories clear, outline fits)"], ["rough", "Rough (within about a quarter)"], ["guess", "A guess"]].map(([v, t]) => `<label><input type="radio" name="confidence" value="${v}" ${saved?.confidence === v ? "checked" : ""}> ${t}</label>`).join("")}`
        : `<h2 style="margin-top:10px">Is this lot actually underused? (your judgment)</h2>
        ${[["yes", "Yes, room to build is real"], ["no", "No"], ["unsure", "Unsure"]].map(([v, t]) => `<label><input type="radio" name="judgment" value="${v}" ${saved?.judgment === v ? "checked" : ""}> ${t}</label>`).join("")}`}
        <textarea id="note" placeholder="Note (what you saw)">${saved?.note || ""}</textarea>
        <div style="display:flex;gap:8px;margin-top:8px"><button class="primary" id="save">Save and next ⏎</button><button id="prev">← Back</button><span id="status" class="muted"></span></div>
      </div>
      <details class="card reveal" style="margin-top:12px" ${saved ? "open" : ""}><summary><strong>What the app says</strong> <span class="muted">(${saved ? "shown after labeling" : "open only after you label, to keep the label blind"})</span></summary>
        <div style="margin-top:6px">District ${l.zone_class || l.zoning_group || "—"} · FAR ${l.far ?? "—"} · lot ${fmt(l.land_sqft)} sq ft<br>
        Building ${fmt(l.bldg_sqft)} sq ft (${l.bldg_sqft_source || "no source"}) ${l.year_built ? "· built " + l.year_built : ""}<br>
        Built ${pct(l.share)} of allowed · room ${fmt(l.room_sqft)} sq ft ${l.room_scope ? "(" + l.room_scope + ")" : ""}<br>
        Rule (under 25% and 2,500+ sq ft room): <strong>${l.rule_underused ? "UNDERUSED" : "not underused"}</strong>
        ${l.v2 ? `<br>Rule v2 (record and LiDAR agree): <strong>${l.v2.toUpperCase()}</strong> · ${l.v2_why}` : ""}</div>
      </details>
    </div>
  </div>`;
  const recalc = () => {
    const far = parseFloat(document.getElementById("far").value);
    let built = 0;
    (ev.lidar_2022 || []).forEach((x, i) => {
      const st = parseFloat(document.querySelector(`[data-b="${i}"][data-k="stories"]`).value) || 0;
      const acc = document.querySelector(`[data-b="${i}"][data-k="accessory"]`).checked;
      if (!acc) built += x.on_lot_sqft * st;
    });
    built += (parseFloat(document.getElementById("exSqft").value) || 0) * (parseFloat(document.getElementById("exStories").value) || 0);
    const allowed = far > 0 && lotSqft ? far * lotSqft : null;
    const share = allowed ? built / allowed : null;
    document.getElementById("calc").innerHTML = `<div class="big">${fmt(built)} sq ft built</div>
      <div>of ${allowed ? fmt(allowed) + " allowed" : "— allowed (no FAR)"} · <span class="bin" style="background:color-mix(in srgb, var(--accent) 16%, transparent)">${share != null ? pct(share) + " · " + binOf(share) : "no share"}</span></div>`;
    return { built, allowed, share };
  };
  for (const el of document.querySelectorAll("main input, main select")) el.addEventListener("input", recalc);
  document.getElementById("zone").onchange = e => {
    const d = dists.find(d => d.zone === e.target.value); if (d && d.far != null) document.getElementById("far").value = d.far; recalc();
  };
  recalc();
  document.getElementById("prev").onclick = () => { cur = Math.max(0, cur - 1); renderList(); render(); };
  document.getElementById("save").onclick = async () => {
    const c = recalc();
    const verdict = document.querySelector("input[name=verdict]:checked").value;
    const label = {
      pin: l.pin, stratum: l.stratum, verdict, judgment: document.querySelector("input[name=judgment]:checked")?.value ?? null,
      confidence: document.querySelector("input[name=confidence]:checked")?.value ?? null, batch: l.batch ?? 1,
      buildings: (ev.lidar_2022 || []).map((x, i) => ({ oid: x.oid, on_lot_sqft: x.on_lot_sqft,
        stories: parseFloat(document.querySelector(`[data-b="${i}"][data-k="stories"]`).value) || 0,
        accessory: document.querySelector(`[data-b="${i}"][data-k="accessory"]`).checked })),
      extra: { sqft: parseFloat(document.getElementById("exSqft").value) || 0, stories: parseFloat(document.getElementById("exStories").value) || 0 },
      zone: document.getElementById("zone").value, far: parseFloat(document.getElementById("far").value) || null,
      lot_sqft: lotSqft, built_sqft: ["empty", "side_yard"].includes(verdict) ? 0 : Math.round(c.built), allowed_sqft: c.allowed ? Math.round(c.allowed) : null,
      share: ["empty", "side_yard"].includes(verdict) ? 0 : (c.share != null ? Math.round(c.share * 1000) / 1000 : null),
      note: document.getElementById("note").value.trim(), labeled_at: new Date().toISOString(),
    };
    const r = await fetch("/label", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(label) });
    if (!r.ok) { document.getElementById("status").textContent = "Couldn't save: " + r.status; return; }
    LABELS[l.pin] = label;
    const next = LOTS.findIndex((x, i) => i > cur && !LABELS[x.pin]);
    cur = next < 0 ? Math.min(cur + 1, LOTS.length - 1) : next;
    renderList(); render(); window.scrollTo(0, 0); document.getElementById("main").scrollTo(0, 0);
  };
}
document.getElementById("onlyTodo").onchange = renderList;
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !["TEXTAREA"].includes(document.activeElement?.tagName)) { e.preventDefault(); document.getElementById("save")?.click(); }
});
load();
</script>
</body>
</html>
