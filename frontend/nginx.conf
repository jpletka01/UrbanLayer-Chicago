server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets — long-lived cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # MapLibre's worker is an ES module (.mjs), which nginx's mime.types doesn't know.
        location ~ \.mjs$ {
            types { application/javascript mjs; }
        }
        # The landing's hero loop (MP4 + WebM, 2026-11-19): named here rather than trusted to mime.types, the
        # repo's rule for a new static type. Range requests (seeking, Safari) work on static files by default.
        location ~ \.(mp4|webm)$ {
            types { video/mp4 mp4; video/webm webm; }
        }
    }

    # index.html — never cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SSE chat endpoint
    location /chat {
        # A page load of /chat (GET/HEAD) is the chat page; only the POST is the SSE endpoint.
        # Without this a reload or a shared /chat link got the backend's 405 (2026-11-14).
        if ($request_method ~ ^(GET|HEAD)$) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # Other backend endpoints
    location /health {
        proxy_pass http://backend:8001;
    }

    location /autocomplete {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    location /section/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
