# Content-Security-Policy, defined once and referenced by every block that sets
# headers (add_header in a child location replaces the server-level set, so the
# policy has to be repeated there — the variable keeps the copies identical).
#  - The sha256 is the inline pre-paint theme script in index.html. Recompute it
#    if that script changes, or the browser will block it (theme flash on load).
#  - scripts.clarity.ms serves clarity.js itself; www.clarity.ms only serves the tag.
map $host $csp {
    default "default-src 'self'; script-src 'self' 'sha256-4S8C5pgfMHJdeQWf6IPCXSQXqRK7QoiVfl9w06sqWWE=' blob: https://static.cloudflareinsights.com https://www.clarity.ms https://scripts.clarity.ms; worker-src blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.mapbox.com https://images.unsplash.com https://lh3.googleusercontent.com https://*.clarity.ms https://c.bing.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.mapbox.com https://api.mapbox.com https://events.mapbox.com https://*.ingest.de.sentry.io https://*.clarity.ms https://c.bing.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

server_tokens off;

# Requests that don't name the site (bare-IP scans, unknown Host/SNI) get nothing.
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name urbanlayerchicago.com www.urbanlayerchicago.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name urbanlayerchicago.com www.urbanlayerchicago.com;

    # Cloudflare Origin Certificate (Full Strict mode)
    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- Real client IP ---
    # Trust CF-Connecting-IP only when the connection comes from Cloudflare, so
    # $remote_addr is the visitor's address. Anyone reaching the origin directly
    # keeps their own address (they can't spoof the header). The backend keys
    # anonymous rate limits on this value via X-Real-IP.
    # Source: https://www.cloudflare.com/ips/ (retrieved 2026-09-28).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $csp always;

    # --- Gzip ---
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # --- Static files ---

    # Hashed assets — long-lived cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # index.html — never cache (add_header in child blocks overrides server-level headers)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp always;
    }

    # --- Backend proxy ---
    # X-Real-IP and X-Forwarded-For are overwritten (never appended) with the
    # address resolved above, so nothing the client sends reaches the backend.

    # PDF feasibility report: generation runs an isolated WeasyPrint render that
    # can take longer than the 60s nginx default. Give it a dedicated 180s read
    # timeout (the backend's own render budget is 150s, so the app errors cleanly
    # before this) while keeping the rest of /api/ snappy at the default.
    location = /api/report {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 16m;
    }

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16m;
    }

    # SSE chat endpoint. The body is JSON only (uploads go through /api/), so a
    # tight cap bounds how much text one request can push toward the LLM.
    location /chat {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        client_max_body_size 512k;
    }

    # Other backend endpoints
    location /health {
        proxy_pass http://backend:8001;
    }

    location /autocomplete {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /section/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
