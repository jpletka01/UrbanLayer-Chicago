name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN. Without an explicit block a job inherits the
# repository default, which can be read/write on every scope; none of these jobs
# needs to write anything through the token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.prod.txt -r requirements.test.txt

      - name: Run backend tests
        run: python -m pytest backend/tests/ -q -m "not integration"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: TypeScript type check
        run: cd frontend && npx tsc --noEmit

      - name: Run frontend tests
        run: cd frontend && npm run test

      - name: Frontend build
        run: cd frontend && npm run build

  # Docs-only pushes must not deploy: `docker compose up -d --build` recreates the
  # frontend/backend containers, so the origin is briefly unreachable and Cloudflare
  # serves 521 for those seconds -- previously on EVERY main push, including one that
  # changed nothing but a .md file. Tests still run; only the restart is skipped.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: filter
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          # A new branch, a force-push, or a pruned base commit means we cannot tell
          # what changed -- deploy rather than silently skip a real code push.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "Base commit unavailable -- deploying."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$before" "${{ github.sha }}")
          echo "Changed files:"; echo "$changed"
          if [ -z "$changed" ]; then
            echo "Nothing changed -- skipping deploy."
            echo "code=false" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -qvE '\.md$|^claude-context/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only push -- skipping deploy."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # This job holds SERVER_SSH_KEY. It reads nothing from the token and writes
    # nothing to the repo.
    permissions:
      contents: read
    steps:
      - name: Deploy to server
        # PINNED to a commit SHA, not the mutable v1 tag. This step is handed
        # SERVER_SSH_KEY; if the tag were repointed at malicious code, that key
        # would go with it. Bump deliberately, checking the diff.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/urbanlayer
            git fetch origin
            git merge origin/main
            # set -e above makes a failed --build fail the deploy. Without it, a broken
            # build left the OLD image running and the health curl still passed → a
            # false-success deploy (hit 2026-06-18: a committed data artifact was missing
            # from .dockerignore's allowlist, so its COPY failed but CI reported green).
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            sleep 10
            curl -sf https://urbanlayerchicago.com/health
