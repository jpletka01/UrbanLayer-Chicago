# Dependabot version updates — free on any repo, no plan required.
#
# Grouped and monthly on purpose. This is a solo project: a stream of individual
# PRs would be ignored, and an ignored bot is worse than none. One batched PR per
# ecosystem per month is reviewable in a sitting.
#
# Security alerts are separate from this file and are enabled in
# Settings -> Code security (free for public repos) — turn those on too; they fire
# immediately rather than waiting for the monthly window.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]
        # Majors stay separate — they need reading, not rubber-stamping.
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    # TypeScript 7 waits for typescript-eslint: its peer range stops at 6, so
    # `npm ci` fails ERESOLVE (PR #37, closed 2026-11-18). Drop this once
    # typescript-eslint accepts ^7.
    # @types/node follows the Node that CI and the image run (frontend/.nvmrc = 24);
    # its majors come with a Node upgrade (PR #260, closed 2026-11-18).
    # i18next 27 needs react-i18next 18 in the same step and its new TFunction types
    # reject passing `t` to our (key, opts) => string helpers: 39 build errors in 14
    # files (PR #261, closed 2026-11-18). A planned migration, not a bump.
    # Decision: claude-context/decisions/2026-10_dependencies.md Item 3.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: i18next
        update-types: [version-update:semver-major]
      - dependency-name: react-i18next
        update-types: [version-update:semver-major]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: monthly
    # Majors ignored. Without this the first run proposed python:3.11-slim ->
    # 3.14-slim (PR #5) — a whole-runtime change dressed as a dependency bump.
    # The stack is pinned to 3.11 deliberately; moving it is a decision, not a
    # dependency update.
    # Python's 3.x steps are "minor" to Dependabot but are runtime migrations
    # here too (PR #168 proposed 3.15-slim and left the Dockerfile copying
    # /usr/local/lib/python3.11), so minors are ignored as well. Patches
    # (3.11.x) still come through.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    labels: [dependencies]
