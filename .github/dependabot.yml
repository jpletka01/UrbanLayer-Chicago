# Dependabot version updates — free on any repo, no plan required.
#
# Grouped and monthly on purpose. This is a solo project: a stream of individual
# PRs would be ignored, and an ignored bot is worse than none. One batched PR per
# ecosystem per month is reviewable in a sitting.
#
# Security alerts are separate from this file and are enabled in
# Settings -> Code security (free for public repos) — turn those on too; they fire
# immediately rather than waiting for the monthly window.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]
        # Majors stay separate — they need reading, not rubber-stamping.
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend-deps:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: monthly
    # Majors ignored. Without this the first run proposed python:3.11-slim ->
    # 3.14-slim (PR #5) — a whole-runtime change dressed as a dependency bump.
    # The stack is pinned to 3.11 deliberately; moving it is a decision, not a
    # dependency update.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major]
    labels: [dependencies]
